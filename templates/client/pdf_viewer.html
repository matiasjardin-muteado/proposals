<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ documento.titulo }} · {{ empresa.nombre }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
      background: #171717;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 18px;
      background: #101010;
      border-bottom: 1px solid #242424;
    }
    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }
    .empresa {
      color: #7c3aed;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      font-size: 11px;
      flex-shrink: 0;
    }
    .sep {
      width: 1px;
      height: 16px;
      background: #303030;
      flex-shrink: 0;
    }
    .titulo {
      min-width: 0;
      color: #f0f0f0;
      font-weight: 500;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .actions {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .actions a, .toolbar button {
      color: #d8d8d8;
      background: #181818;
      text-decoration: none;
      font-size: 12px;
      padding: 8px 11px;
      border: 1px solid #303030;
      border-radius: 5px;
      transition: all .15s;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
    }
    .actions a:hover, .toolbar button:hover {
      color: #fff;
      border-color: #7c3aed;
    }
    .toolbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 12px;
      background: #151515;
      border-bottom: 1px solid #242424;
    }
    .toolbar button {
      min-width: 36px;
      padding: 7px 10px;
    }
    .page-status {
      min-width: 98px;
      text-align: center;
      color: #aaa;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .viewer {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .pdf-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      background: #252525;
      padding: 18px 12px 32px;
    }
    .pdf-pages {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      min-height: 100%;
    }
    .pdf-page {
      max-width: 100%;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0,0,0,.28);
      overflow: hidden;
      position: relative;
    }
    .pdf-page canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }
    .page-label {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(17,17,17,.78);
      color: #fff;
      border-radius: 3px;
      padding: 3px 7px;
      font-size: 10px;
      pointer-events: none;
    }
    .loading, .error {
      margin: auto;
      max-width: 340px;
      padding: 28px;
      text-align: center;
      color: #aaa;
      line-height: 1.5;
    }
    .error { color: #fc8181; }

    @media (max-width: 640px) {
      .topbar {
        align-items: flex-start;
        padding: 10px 12px;
      }
      .brand {
        display: block;
      }
      .sep { display: none; }
      .titulo {
        display: block;
        max-width: 58vw;
        margin-top: 2px;
      }
      .actions a {
        padding: 8px 10px;
      }
      .toolbar {
        justify-content: space-between;
        gap: 5px;
        padding: 8px;
      }
      .toolbar button {
        min-width: 34px;
        padding: 8px;
      }
      .page-status {
        min-width: 74px;
      }
      .pdf-scroll {
        padding: 10px 8px 24px;
      }
      .pdf-pages {
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <span class="empresa">{{ empresa.nombre }}</span>
      <span class="sep"></span>
      <span class="titulo">{{ documento.titulo }}</span>
    </div>
    <div class="actions">
      <a href="{{ pdf_url }}" download="{{ documento.file_name or documento.slug + '.pdf' }}">Descargar</a>
    </div>
  </div>

  <div class="viewer">
    <div class="toolbar" aria-label="Controles del PDF">
      <button type="button" id="prevPage" aria-label="Pagina anterior">‹</button>
      <div class="page-status" id="pageStatus">- / -</div>
      <button type="button" id="nextPage" aria-label="Pagina siguiente">›</button>
      <button type="button" id="zoomOut" aria-label="Alejar">-</button>
      <button type="button" id="fitWidth" aria-label="Ajustar ancho">100%</button>
      <button type="button" id="zoomIn" aria-label="Acercar">+</button>
    </div>
    <div class="pdf-scroll" id="pdfScroll">
      <div class="pdf-pages" id="pdfPages">
        <div class="loading">Cargando PDF...</div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
  (function() {
    var DOC_ID = {{ documento.id }};
    var PDF_URL = {{ pdf_url|tojson }};
    var TRACKING_TOKEN = {{ tracking_token|tojson }};
    var BASE = window.location.protocol + '//' + window.location.host;
    var sessionId = null;
    var startTime = Date.now();
    var activeTime = 0;
    var lastActive = Date.now();
    var isActive = true;
    var pdfDoc = null;
    var scale = 1;
    var fitScale = 1;
    var currentPage = 1;
    var pageTimes = {};
    var pageCount = 0;
    var observer = null;
    var renderVersion = 0;
    var queuedEvents = [];

    var scrollEl = document.getElementById('pdfScroll');
    var pagesEl = document.getElementById('pdfPages');
    var pageStatus = document.getElementById('pageStatus');

    function send(url, data) {
      var json = JSON.stringify(data);
      if (navigator.sendBeacon) {
        var blob = new Blob([json], {type: 'application/json'});
        navigator.sendBeacon(url, blob);
      } else {
        fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:json, keepalive:true});
      }
    }

    function track(type, data) {
      if (!sessionId) {
        queuedEvents.push({type: type, data: data || {}});
        return;
      }
      send(BASE + '/t/event', {session_id: sessionId, event_type: type, data: data || {}});
    }

    function flushQueuedEvents() {
      if (!sessionId || !queuedEvents.length) return;
      queuedEvents.splice(0).forEach(function(event) {
        track(event.type, event.data);
      });
    }

    function pageLabel(pageNumber) {
      return 'Pagina ' + pageNumber;
    }

    function pageTimesSeconds() {
      var out = {};
      Object.keys(pageTimes).forEach(function(page) {
        out[pageLabel(page)] = Math.round(pageTimes[page] / 1000);
      });
      return out;
    }

    function addActiveTime() {
      if (!isActive) return;
      var now = Date.now();
      var delta = now - lastActive;
      if (delta > 0 && delta < 120000) {
        activeTime += delta;
        pageTimes[currentPage] = (pageTimes[currentPage] || 0) + delta;
      }
      lastActive = now;
    }

    function updatePageStatus() {
      pageStatus.textContent = pageCount ? (currentPage + ' / ' + pageCount) : '- / -';
    }

    function setCurrentPage(pageNumber, shouldTrack) {
      pageNumber = Math.max(1, Math.min(pageCount || 1, pageNumber));
      if (pageNumber === currentPage) {
        updatePageStatus();
        return;
      }
      addActiveTime();
      currentPage = pageNumber;
      updatePageStatus();
      if (shouldTrack !== false) {
        track('pdf_page_view', {
          page: currentPage,
          section: pageLabel(currentPage)
        });
      }
    }

    function goToPage(pageNumber) {
      var target = document.getElementById('page-' + pageNumber);
      if (!target) return;
      setCurrentPage(pageNumber);
      target.scrollIntoView({block: 'start', behavior: 'smooth'});
    }

    function computeFitScale(page) {
      var viewport = page.getViewport({scale: 1});
      var available = Math.max(280, scrollEl.clientWidth - 24);
      return Math.max(0.35, Math.min(2.4, available / viewport.width));
    }

    function renderPage(pageNumber, version) {
      return pdfDoc.getPage(pageNumber).then(function(page) {
        if (version !== renderVersion) return;
        var viewport = page.getViewport({scale: scale});
        var outputScale = Math.min(window.devicePixelRatio || 1, 2);
        var wrapper = document.createElement('article');
        wrapper.className = 'pdf-page';
        wrapper.id = 'page-' + pageNumber;
        wrapper.dataset.page = pageNumber;

        var canvas = document.createElement('canvas');
        var ctx = canvas.getContext('2d');
        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);
        canvas.style.width = Math.floor(viewport.width) + 'px';
        canvas.style.height = Math.floor(viewport.height) + 'px';
        ctx.setTransform(outputScale, 0, 0, outputScale, 0, 0);

        var label = document.createElement('div');
        label.className = 'page-label';
        label.textContent = pageNumber;

        wrapper.appendChild(canvas);
        wrapper.appendChild(label);
        pagesEl.appendChild(wrapper);

        return page.render({canvasContext: ctx, viewport: viewport}).promise;
      });
    }

    function setupObserver() {
      if (observer) observer.disconnect();
      observer = new IntersectionObserver(function(entries) {
        var best = null;
        entries.forEach(function(entry) {
          if (!entry.isIntersecting) return;
          if (!best || entry.intersectionRatio > best.intersectionRatio) {
            best = entry;
          }
        });
        if (best) {
          setCurrentPage(parseInt(best.target.dataset.page, 10));
        }
      }, {
        root: scrollEl,
        threshold: [0.12, 0.25, 0.5, 0.75]
      });

      Array.prototype.forEach.call(document.querySelectorAll('.pdf-page'), function(page) {
        observer.observe(page);
      });
    }

    function renderAll(preservePage) {
      if (!pdfDoc) return;
      addActiveTime();
      renderVersion += 1;
      var version = renderVersion;
      preservePage = preservePage || currentPage;
      pagesEl.innerHTML = '';

      var chain = Promise.resolve();
      for (var i = 1; i <= pageCount; i += 1) {
        (function(pageNumber) {
          chain = chain.then(function() {
            return renderPage(pageNumber, version);
          });
        })(i);
      }

      chain.then(function() {
        if (version !== renderVersion) return;
        setupObserver();
        updatePageStatus();
        var target = document.getElementById('page-' + preservePage);
        if (target) target.scrollIntoView({block: 'start'});
      }).catch(function() {
        pagesEl.innerHTML = '<div class="error">No se pudo renderizar el PDF.</div>';
      });
    }

    function loadPdf() {
      if (!window.pdfjsLib) {
        pagesEl.innerHTML = '<div class="error">No se pudo cargar el visor PDF.</div>';
        return;
      }
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

      pdfjsLib.getDocument(PDF_URL).promise.then(function(pdf) {
        pdfDoc = pdf;
        pageCount = pdf.numPages;
        return pdf.getPage(1);
      }).then(function(firstPage) {
        fitScale = computeFitScale(firstPage);
        scale = fitScale;
        currentPage = 1;
        updatePageStatus();
        renderAll(1);
        track('pdf_loaded', {pages: pageCount, scale: scale});
        track('pdf_page_view', {page: 1, section: pageLabel(1)});
      }).catch(function() {
        pagesEl.innerHTML = '<div class="error">No se pudo abrir el PDF. Probá descargarlo.</div>';
      });
    }

    fetch(BASE + '/t/session', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        documento_id: DOC_ID,
        tracking_token: TRACKING_TOKEN,
        screen: window.screen.width + 'x' + window.screen.height,
        referrer: document.referrer || '',
        tz: Intl.DateTimeFormat().resolvedOptions().timeZone
      })
    }).then(function(r) { return r.json(); }).then(function(d) {
      sessionId = d.session_id;
      track('page_view', {
        viewport: window.innerWidth + 'x' + window.innerHeight,
        screen: window.screen.width + 'x' + window.screen.height,
        tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
        doc_type: 'pdf',
        page: currentPage,
        section: pageLabel(currentPage)
      });
      flushQueuedEvents();
    });

    document.getElementById('prevPage').addEventListener('click', function() {
      goToPage(currentPage - 1);
    });
    document.getElementById('nextPage').addEventListener('click', function() {
      goToPage(currentPage + 1);
    });
    document.getElementById('zoomOut').addEventListener('click', function() {
      scale = Math.max(0.35, scale - 0.15);
      renderAll(currentPage);
    });
    document.getElementById('zoomIn').addEventListener('click', function() {
      scale = Math.min(3, scale + 0.15);
      renderAll(currentPage);
    });
    document.getElementById('fitWidth').addEventListener('click', function() {
      if (!pdfDoc) return;
      pdfDoc.getPage(1).then(function(page) {
        fitScale = computeFitScale(page);
        scale = fitScale;
        renderAll(currentPage);
      });
    });

    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        addActiveTime();
        isActive = false;
        track('tab_hidden', {
          active_s: Math.round(activeTime/1000),
          page: currentPage,
          section: pageLabel(currentPage),
          page_times: pageTimesSeconds(),
          section_times: pageTimesSeconds()
        });
      } else {
        isActive = true;
        lastActive = Date.now();
        track('tab_visible', {page: currentPage, section: pageLabel(currentPage)});
      }
    });

    window.addEventListener('focus', function() {
      if (!isActive) {
        isActive = true;
        lastActive = Date.now();
      }
    });
    window.addEventListener('blur', function() {
      if (isActive) {
        addActiveTime();
        isActive = false;
      }
    });

    setInterval(function() {
      addActiveTime();
      track('heartbeat', {
        total_s: Math.round((Date.now()-startTime)/1000),
        active_s: Math.round(activeTime/1000),
        scroll: pageCount ? Math.round((currentPage / pageCount) * 100) : 0,
        page: currentPage,
        section: pageLabel(currentPage),
        page_times: pageTimesSeconds(),
        section_times: pageTimesSeconds()
      });
    }, 30000);

    document.addEventListener('click', function(e) {
      var el = e.target;
      var tag = el.tagName ? el.tagName.toLowerCase() : '';
      track('click', {
        tag: tag,
        text: (el.innerText || el.getAttribute('aria-label') || '').slice(0,60),
        href: el.href || '',
        page: currentPage,
        section: pageLabel(currentPage)
      });
    });

    window.addEventListener('resize', function() {
      if (!pdfDoc) return;
      pdfDoc.getPage(1).then(function(page) {
        fitScale = computeFitScale(page);
      });
    });

    window.addEventListener('beforeunload', function() {
      addActiveTime();
      send(BASE + '/t/event', {
        session_id: sessionId,
        event_type: 'page_exit',
        data: {
          total_s: Math.round((Date.now()-startTime)/1000),
          active_s: Math.round(activeTime/1000),
          scroll: pageCount ? Math.round((currentPage / pageCount) * 100) : 0,
          page: currentPage,
          section: pageLabel(currentPage),
          page_times: pageTimesSeconds(),
          section_times: pageTimesSeconds()
        }
      });
    });

    loadPdf();
  })();
  </script>
</body>
</html>
